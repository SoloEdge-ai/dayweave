services:
  dayweave:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DAYWEAVE_PORT:-8787}:8000"
    environment:
      DAYWEAVE_DATA_DIR: /data
      DAYWEAVE_ADMIN_PASSWORD: ${DAYWEAVE_ADMIN_PASSWORD:-}
      DAYWEAVE_ENABLE_SIGNUP: ${DAYWEAVE_ENABLE_SIGNUP:-1}
      DAYWEAVE_COOKIE_SECURE: ${DAYWEAVE_COOKIE_SECURE:-0}
      FORWARDED_ALLOW_IPS: ${DAYWEAVE_PROXY_IP:-127.0.0.1}
      DAYWEAVE_TRUSTED_HTTP_BASES: ${DAYWEAVE_TRUSTED_HTTP_BASES:-}
    volumes:
      - workspace:/data
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health',timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
volumes:
  workspace:
