services:
  dayweave:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DAYWEAVE_PORT:-8787}:8000"
    environment:
      DAYWEAVE_DATA_DIR: /data
      DAYWEAVE_CODEX_TMPDIR: /run/dayweave-codex
      DAYWEAVE_SMTP_HOST: ${DAYWEAVE_SMTP_HOST:-}
      DAYWEAVE_SMTP_PORT: ${DAYWEAVE_SMTP_PORT:-587}
      DAYWEAVE_SMTP_SECURITY: ${DAYWEAVE_SMTP_SECURITY:-starttls}
      DAYWEAVE_SMTP_USER: ${DAYWEAVE_SMTP_USER:-}
      DAYWEAVE_SMTP_PASSWORD: ${DAYWEAVE_SMTP_PASSWORD:-}
      DAYWEAVE_MAIL_FROM: ${DAYWEAVE_MAIL_FROM:-}
      DAYWEAVE_ENABLE_SIGNUP: ${DAYWEAVE_ENABLE_SIGNUP:-1}
      DAYWEAVE_COOKIE_SECURE: ${DAYWEAVE_COOKIE_SECURE:-0}
      FORWARDED_ALLOW_IPS: ${DAYWEAVE_PROXY_IP:-127.0.0.1}
      DAYWEAVE_TRUSTED_HTTP_BASES: ${DAYWEAVE_TRUSTED_HTTP_BASES:-}
    volumes:
      - workspace:/data
    tmpfs:
      - /run/dayweave-codex:rw,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=128m
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health',timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
volumes:
  workspace:
