    '<div class="chat-flow">'+(chatSettings?settingsExample():'')+(!turns.length?'<div class="chat-intro"><h3>'+msg('intro')+'</h3><p>'+msg('introBody')+'</p></div>':'')+
    turns.map(t=>'<div class="chat-user">'+esc(t.input)+'</div>'+chatDraft(t)).join('')+'</div>'+
    '<div class="chat-composer"><div class="suggestions"><button type="button" data-sample>'+icon('mic')+' '+msg('voiceExample')+'</button><button type="button" data-local-settings>'+msg('settings')+'</button></div>'+
    '<form id="composer"><textarea name="text" rows="2" maxlength="500" required aria-label="'+msg('ask')+'" placeholder="'+msg('ask')+'">'+esc(chatInput)+'</textarea><div class="composer-foot"><span class="chat-mode">'+icon(voiceExample?'mic':'spark')+msg(voiceExample?'audioMock':'sampleMode')+'</span><button class="chat-send" type="submit">'+msg('send')+icon('arrow')+'</button></div></form></div>';
  assistant.querySelector('.chat-flow').scrollTop=old;
}
function reveal(t){
  if(t.kind==='none'){if(innerWidth<=950)backlogOpen=true}
  else if(t.kind==='day'){
    selected=t.day;
    mode=selected===today?'today':selected===add(today,1)?'tomorrow':(selected>=monday&&selected<=add(monday,6))?'week':(selected>=add(monday,7)&&selected<=add(monday,13))?'next':'month';
  }else{mode=t.kind;selected=mode==='next'?add(monday,7):today}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-open-chat')){drawChat();assistant.showModal();return}
  if(b.hasAttribute('data-hide-chat')){assistant.close();return}
  if(b.hasAttribute('data-sample')){chatInput=msg('sampleText');voiceExample=true;drawChat();assistant.querySelector('textarea').focus();return}
  if(b.hasAttribute('data-local-settings')){chatSettings=!chatSettings;drawChat();assistant.querySelector('.chat-flow').scrollTop=0;return}
  const t=turns.find(v=>v.id===Number(b.dataset.drop||b.dataset.showTask));
  if(t&&b.dataset.drop&&t.state==='pending'){t.state='cancelled';drawChat()}
  if(t&&b.dataset.showTask&&t.state==='created'){assistant.close();reveal(t)}
});
assistant.addEventListener('input',e=>{
  const input=e.target,form=input.closest('[data-draft]');
  if(input.name==='text'){chatInput=input.value;return}
  const t=form&&turns.find(x=>x.id===Number(form.dataset.draft));
  if(t&&t.state==='pending'&&['title','kind','minutes','due','day'].includes(input.name))t[input.name]=input.value;
});
assistant.addEventListener('change',e=>{
  if(e.target.id==='chat-language'){lang=e.target.value;render();drawChat();return}
  if(e.target.name==='kind'){const t=turns.find(x=>x.id===Number(e.target.form.dataset.draft));t.kind=e.target.value;drawChat();assistant.querySelector('[data-draft="'+t.id+'"] select').focus({preventScroll:true})}
});
assistant.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='composer'){
    const text=chatInput.trim();if(!text)return;
    if(/^(settings|open settings|设置|打开设置|設定)$/i.test(text)){chatSettings=true;chatInput='';voiceExample=false;drawChat();assistant.querySelector('.chat-flow').scrollTop=0;return}
    const draft=newDraft(text);turns.push(draft);chatInput='';voiceExample=false;chatSettings=false;drawChat();
    assistant.querySelector('[data-turn="'+draft.id+'"]').scrollIntoView({block:'nearest'});return;
  }
  const t=turns.find(x=>x.id===Number(f.dataset.draft));
  if(!t||t.state!=='pending'||!t.title.trim()||!f.checkValidity())return;
  t.state='created';t.taskId=Math.max(...tasks.map(x=>x.id))+1;
  task(t.taskId,[t.title.trim(),t.title.trim(),t.title.trim()],'unassigned',t.minutes?Number(t.minutes):null,t.kind==='none'?'':t.kind==='day'?t.day:t.kind,'any',t.due);
  if(t.kind!=='none')reveal(t);else render();
  drawChat();
});
assistant.addEventListener('keydown',e=>{if(e.target.name==='text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit()}});
assistant.addEventListener('close',()=>document.querySelector('[data-open-chat]')?.focus({preventScroll:true}));
render();
</script>
</body>
</html>
